---
# Site-specific values to review before deployment are marked "SITE".
cluster: cluster   # SITE: the cluster name in /etc/ood/config/clusters.d

attributes:
  bc_queue:
    widget: select
    label: Partition
    help: |
      Use a GPU partition only if the session requires GPU encoding or a
      GPU-accelerated QuPath extension; CPU partitions are suitable for most
      viewing and annotation work.
    options:   # SITE: partition names
      - ["short", "short"]
      - ["long", "long"]

  num_cores:
    widget: number_field
    label: CPU cores
    value: 2
    min: 2
    max: 32
    step: 1
    help: |
      Two of these cores are used to render and stream the display; the
      remainder are available to QuPath for analysis.

  memory_gb:
    widget: number_field
    label: Memory (GB)
    value: 4
    min: 8
    max: 256
    step: 4
    help: |
      Approximately 75% of this is given to QuPath as Java heap; the rest is
      reserved for the display, the stream encoder and native libraries.

  use_gpu:
    widget: check_box
    label: Request a GPU
    value: "0"
    help: |
      Select only on a GPU partition. The GPU is used to encode the video
      stream and is available to QuPath extensions.

  rendering:
    widget: select
    label: QuPath rendering
    options:
      - ["Software (recommended)", "sw"]
      - ["OpenGL (experimental)", "es2"]
    help: |
      Software rendering is the most reliable choice on compute nodes.

  qupath_version:
    widget: hidden_field
    value: "0.7.0"   # SITE: matches the container image installed below

form:
  - bc_queue
  - bc_num_hours
  - num_cores
  - memory_gb
  - use_gpu
  - rendering
  - qupath_version
